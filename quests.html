<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tutorly</title>
  <link rel="icon" type="image/png" href="assets/brand-star.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
  <link rel="stylesheet" href="css/global-layout.css" />
  <style>
    .quests-shell { margin-top: 14px; }

    .quests-hero {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 16px;
      align-items: center;
    }

    .badge-track {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .quest-grid {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .quest-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: linear-gradient(120deg, #ffffff, #f8fbff);
      box-shadow: var(--shadow-1);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .quest-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-2); }

    .quest-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }

    .quest-level {
      font-size: 12px;
      font-weight: 800;
      border-radius: 999px;
      padding: 4px 10px;
      background: #ecf2ff;
      color: #3559d3;
      border: 1px solid #cfe0ff;
    }

    .coin-reward {
      font-size: 12px;
      font-weight: 800;
      color: #8b5a00;
      background: #fff3cd;
      border: 1px solid #f4d47e;
      border-radius: 999px;
      padding: 4px 10px;
    }

    .quest-title { margin: 0; font-size: 22px; color: #2f4a81; font-family: "Inter", sans-serif; }
    .quest-desc { margin: 6px 0 10px; color: var(--muted); line-height: 1.7; min-height: 68px; }

    .quest-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #567;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .quest-progress-copy { display:flex; justify-content:space-between; gap:10px; margin:0 0 7px; color:#567; font-size:12px; font-weight:800; }
    .quest-progress { height:8px; overflow:hidden; border-radius:999px; background:#e9eef8; margin-bottom:14px; }
    .quest-progress span { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,#4f7cff,#7a5cff); transition:width 220ms cubic-bezier(.2,.8,.2,1); }
    .quest-card.is-complete { border-color:#b9dfcb; background:linear-gradient(120deg,#fff,#f2fbf6); }
    .quest-card.is-complete .quest-progress span { background:#159a72; }
    .quest-open { width:100%; text-align:center; text-decoration:none; }

    @media (max-width: 980px) {
      .quests-hero, .quest-grid { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="css/mobile-app.css?v=mobile-first-20260623" />
  <link rel="stylesheet" href="css/tutorly-theme.css?v=unified-20260822" />
</head>
<body data-tutorly-surface="workspace">
  <a class="back-home-btn" href="home.html" aria-label="Back to Home">Home</a>
  <header class="shell header-wrap fade-up">
    <div class="topbar">
      <div class="brand"><img class="brand-title-logo" src="assets/title-logo.png" alt="Tutorly" /></div>
      <nav class="nav-links">
        <a href="maths_gpt.html">Tutorly Chat</a>
        <a href="home.html">Chat</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="shell quests-shell">
    <section class="panel panel-soft quests-hero fade-up d2">
      <div>
        <span class="pill pill-orange">Real learning quests</span>
        <h1 class="page-title" style="font-size: 44px; margin-top: 8px;">Daily & Weekly Quests</h1>
        <p class="page-sub">Practice, tests and lessons update your progress automatically.</p>
        <div class="badge-track">
          <span class="pill pill-blue">Current Coins: <b id="coinsBadge">0</b></span>
          <span class="pill pill-green">Weekly XP: <b id="weeklyXpBadge">0</b></span>
          <span class="pill pill-blue">Total XP: <b id="totalXpBadge">0</b></span>
          <span class="pill pill-orange">Completed: <b id="doneBadge">0/0</b></span>
        </div>
      </div>
      <div style="text-align:center;">
        <img src="assets/brand-star.png" alt="" style="width:72px;height:72px;object-fit:contain;" />
        <p class="muted" style="margin: 8px 0 0; font-weight:700;">Keep learning. Tutorly handles the tracking.</p>
      </div>
    </section>

    <section class="quest-grid fade-up d3" id="questGrid"></section>
  </main>

  <script src="js/auth-client.js?v=quests-20260904"></script>
  <script src="js/quest-client.js?v=quests-20260904"></script>
  <script src="js/quests.js?v=quests-20260904"></script>
  <script src="js/global-layout.js?v=nav-redesign-20260531"></script>
  <script src="js/swipe-home.js?v=nav-redesign-20260531d"></script>
  <script src="js/mobile-app.js?v=mobile-first-20260623"></script>
</body>
</html>
