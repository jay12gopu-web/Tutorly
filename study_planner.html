<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tutorly</title>
  <link rel="icon" type="image/png" href="assets/brand-star.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tutorly-foundation.css" />
</head>
<body data-foundation-page="planner">
  <header class="foundation-header"><div class="foundation-header-inner">
    <a class="foundation-brand" href="maths_gpt.html"><span class="foundation-brand-mark">&#10022;</span>Tutorly</a>
    <div class="foundation-actions"><button id="foundationTheme" class="foundation-icon" type="button" aria-label="Switch color theme">☾</button><a class="foundation-button-secondary" href="maths_gpt.html">Back to chat</a></div>
  </div></header>
  <main class="foundation-main">
    <section class="foundation-hero"><p class="foundation-eyebrow">Study Planner</p><h1>Make a clear plan, then focus on one step.</h1><p>Create a simple study queue by subject, date, and duration. Your plan is stored on this device.</p></section>
    <section class="foundation-grid two">
      <article class="foundation-card"><h2>Plan a session</h2><form id="plannerForm" class="foundation-form">
        <input class="foundation-input" name="topic" placeholder="Topic to study" required /><div class="foundation-form-row"><select class="foundation-input" name="subject"><option>Mathematics</option><option>Science</option><option>English</option><option>Social Studies</option><option>General</option></select><input class="foundation-input" name="date" type="date" /></div>
        <input class="foundation-input" name="duration" type="number" min="10" max="240" value="30" aria-label="Duration in minutes" /><button class="foundation-button" type="submit">Add to plan</button>
      </form></article>
      <article class="foundation-card"><h2>Upcoming sessions</h2><div id="plannerList" class="foundation-list"></div><p id="plannerEmpty" class="foundation-empty">Your study plan is empty.</p></article>
    </section>
  </main>
  <script src="js/tutorly-foundation.js"></script>
</body>
</html>
