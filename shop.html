<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tutorly</title>
  <link rel="icon" type="image/png" href="assets/brand-star.png" />
  <link rel="stylesheet" href="css/global-layout.css" />
  <style>
    :root {
      --bg: #eef5ff;
      --ink: #18213a;
      --muted: #65728c;
      --blue: #347cff;
      --purple: #8267ff;
      --green: #16b889;
      --coral: #ff7a59;
      --gold: #f2b84b;
      --line: rgba(87, 117, 188, 0.18);
      --glass: rgba(255, 255, 255, 0.74);
      --glass-strong: rgba(255, 255, 255, 0.9);
      --shadow: 0 24px 62px rgba(42, 71, 134, 0.18);
      --shadow-soft: 0 14px 34px rgba(42, 71, 134, 0.12);
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --gradient: linear-gradient(135deg, var(--blue), var(--purple));
    }

    * { box-sizing: border-box; }

    html,
    body {
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    body {
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 8%, rgba(52, 124, 255, 0.2), transparent 30%),
        radial-gradient(circle at 90% 12%, rgba(130, 103, 255, 0.18), transparent 28%),
        radial-gradient(circle at 18% 94%, rgba(22, 184, 137, 0.13), transparent 30%),
        linear-gradient(135deg, #edf5ff 0%, #f7fbff 48%, #f2eeff 100%);
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }

    body.cart-popup-open {
      overflow: hidden;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; }

    .app-shell {
      width: min(1440px, calc(100% - 40px));
      margin: 18px auto;
    }

    .topbar {
      position: sticky;
      top: 14px;
      z-index: 20;
      min-height: 86px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border: 1px solid rgba(255,255,255,0.72);
      border-radius: var(--radius-xl);
      padding: 14px 20px;
      background: linear-gradient(145deg, rgba(255,255,255,0.9), rgba(238,245,255,0.7));
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(22px);
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
    }

    .brand-logo {
      width: clamp(164px, 18vw, 214px);
      height: 56px;
      border-radius: 16px;
      object-fit: cover;
      object-position: center;
      filter: drop-shadow(0 12px 24px rgba(52, 124, 255, 0.22));
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      min-width: 0;
    }

    .back-link,
    .coin-chip {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 999px;
      padding: 0 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .back-link {
      color: #254784;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.76);
      box-shadow: 0 12px 24px rgba(42, 71, 134, 0.1);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .back-link:hover,
    .buy-btn:hover,
    .cart-secondary:hover,
    .cart-checkout:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-soft);
    }

    .coin-chip {
      color: #8a6207;
      border: 1px solid rgba(242, 184, 75, 0.42);
      background: rgba(255,255,255,0.78);
      box-shadow: 0 12px 24px rgba(203, 151, 30, 0.13);
    }

    .coin {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #fff3ad, #f2b84b 70%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    }

    .shop-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(330px, 0.36fr);
      gap: 24px;
      align-items: start;
      margin-top: 24px;
    }

    .panel,
    .shop-card {
      border: 1px solid rgba(255,255,255,0.72);
      background: linear-gradient(145deg, rgba(255,255,255,0.82), rgba(239,246,255,0.66));
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(18px);
    }

    .hero-panel {
      position: relative;
      grid-column: 1 / -1;
      overflow: hidden;
      border-radius: var(--radius-xl);
      padding: clamp(28px, 4.4vw, 54px);
      min-height: 260px;
    }

    .hero-panel::after {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      right: -80px;
      top: -90px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(130, 103, 255, 0.26), transparent 70%);
      pointer-events: none;
    }

    .kicker {
      width: fit-content;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(22, 184, 137, 0.18);
      border-radius: 999px;
      padding: 7px 12px;
      color: #087860;
      background: rgba(22, 184, 137, 0.08);
      font-size: 13px;
      font-weight: 900;
    }

    .title {
      max-width: 980px;
      margin: 14px 0 0;
      color: var(--ink);
      font-size: clamp(46px, 6vw, 78px);
      line-height: 0.98;
      letter-spacing: -0.055em;
      font-weight: 930;
    }

    .sub {
      max-width: 920px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 19px;
      line-height: 1.65;
      font-weight: 750;
    }

    .shop-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      grid-column: 1;
      grid-row: 2;
    }

    .shop-card {
      position: relative;
      overflow: hidden;
      display: grid;
      gap: 16px;
      min-height: 246px;
      border-radius: var(--radius-lg);
      padding: 22px;
      transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
    }

    .shop-card:hover {
      transform: translateY(-3px);
      filter: brightness(1.02);
      box-shadow: var(--shadow);
    }

    .shop-card::after {
      content: "";
      position: absolute;
      width: 130px;
      height: 130px;
      right: -58px;
      top: -58px;
      border-radius: 50%;
      background: rgba(52, 124, 255, 0.12);
      pointer-events: none;
    }

    .item-top {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .item-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 17px;
      color: #fff;
      background: var(--gradient);
      box-shadow: 0 14px 26px rgba(52, 124, 255, 0.22);
      font-size: 17px;
      font-weight: 950;
    }

    .tag {
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 0 10px;
      color: #254784;
      background: rgba(52, 124, 255, 0.1);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .shop-card h2 {
      position: relative;
      z-index: 1;
      margin: 0;
      color: #1f2d4e;
      font-size: 24px;
      line-height: 1.08;
      letter-spacing: -0.035em;
    }

    .shop-card p {
      position: relative;
      z-index: 1;
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      font-weight: 750;
    }

    .item-bottom {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: auto;
    }

    .price {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #8a6207;
      font-size: 16px;
      font-weight: 950;
    }

    .price .coin {
      width: 22px;
      height: 22px;
      font-size: 12px;
    }

    .buy-btn {
      min-height: 42px;
      border: 0;
      border-radius: 999px;
      padding: 0 16px;
      color: #fff;
      background: var(--gradient);
      box-shadow: 0 16px 30px rgba(52, 124, 255, 0.24);
      cursor: pointer;
      font-weight: 900;
      transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
    }

    .buy-btn:disabled {
      color: #6e7891;
      background: rgba(226, 234, 247, 0.92);
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .cart-panel {
      position: sticky;
      top: 126px;
      grid-column: 2;
      grid-row: 2;
      border-radius: var(--radius-xl);
      padding: 24px;
    }

    .cart-head,
    .cart-actions,
    .cart-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .cart-title-wrap {
      order: 0;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 12px;
      min-width: 0;
      text-align: left;
    }

    .cart-icon {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: #fff;
      background: var(--gradient);
      box-shadow: 0 14px 26px rgba(52, 124, 255, 0.22);
    }

    .cart-icon svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .cart-close {
      display: none;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: #254784;
      background: rgba(255,255,255,0.76);
      cursor: pointer;
      font-size: 24px;
      line-height: 1;
      font-weight: 850;
    }

    .panel-title {
      margin: 0;
      color: #1f2d4e;
      font-size: 24px;
      letter-spacing: -0.035em;
    }

    .panel-copy {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.55;
      font-weight: 750;
    }

    .cart-pill {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid rgba(242, 184, 75, 0.34);
      border-radius: 999px;
      padding: 0 13px;
      color: #8a6207;
      background: rgba(255,255,255,0.72);
      font-weight: 950;
      white-space: nowrap;
    }

    .cart-list {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .cart-row {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
      color: #29395f;
      background: rgba(255,255,255,0.66);
      font-size: 14px;
      font-weight: 850;
    }

    .cart-row b {
      min-width: 34px;
      display: inline-grid;
      place-items: center;
      border-radius: 999px;
      padding: 4px 8px;
      color: #254784;
      background: rgba(52, 124, 255, 0.1);
    }

    .cart-item-main {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .cart-item-main span {
      color: #22345f;
      font-weight: 900;
    }

    .cart-item-main small {
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }

    .quantity-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .qty-btn {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: #254784;
      background: rgba(255,255,255,0.74);
      cursor: pointer;
      font-size: 19px;
      line-height: 1;
      font-weight: 950;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .qty-btn:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,0.95);
      box-shadow: 0 8px 16px rgba(42, 71, 134, 0.1);
    }

    .cart-empty {
      margin: 0;
      border: 1px dashed rgba(87, 117, 188, 0.24);
      border-radius: 18px;
      padding: 18px;
      color: var(--muted);
      background: rgba(255,255,255,0.54);
      font-weight: 800;
      text-align: center;
    }

    .cart-actions {
      justify-content: flex-end;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .cart-secondary,
    .cart-checkout {
      min-height: 42px;
      border-radius: 999px;
      padding: 0 18px;
      cursor: pointer;
      font-weight: 900;
      transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
    }

    .cart-secondary {
      color: #254784;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.72);
    }

    .cart-checkout {
      border: 0;
      color: #fff;
      background: var(--gradient);
      box-shadow: 0 16px 30px rgba(52, 124, 255, 0.22);
    }

    .cart-secondary:disabled,
    .cart-checkout:disabled {
      color: #6e7891;
      background: rgba(226, 234, 247, 0.92);
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .cart-backdrop {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      background: rgba(31, 39, 68, 0.24);
      backdrop-filter: blur(8px);
    }

    .mobile-cart-fab {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 80;
      min-width: 62px;
      height: 62px;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid rgba(255,255,255,0.72);
      border-radius: 999px;
      color: #fff;
      background: var(--gradient);
      box-shadow: 0 20px 38px rgba(52, 124, 255, 0.28);
      cursor: pointer;
      font-weight: 950;
    }

    .mobile-cart-fab svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mobile-cart-count {
      min-width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: #254784;
      background: rgba(255,255,255,0.9);
      font-size: 12px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 60;
      max-width: min(420px, calc(100% - 24px));
      border: 1px solid rgba(255,255,255,0.78);
      border-radius: 999px;
      padding: 12px 18px;
      color: #243355;
      background: rgba(255,255,255,0.9);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(16px);
      font-weight: 850;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 18px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .fade-up {
      opacity: 0;
      animation: fadeUp 520ms cubic-bezier(.2,.8,.2,1) forwards;
    }

    .d2 { animation-delay: 90ms; }
    .d3 { animation-delay: 160ms; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 1080px) {
      .shop-grid { grid-template-columns: 1fr; }

      .hero-panel,
      .cart-panel,
      .shop-list {
        grid-column: 1;
      }

      .cart-panel {
        position: static;
        grid-row: 2;
      }

      .shop-list {
        grid-row: 3;
      }
    }

    @media (max-width: 720px) {
      .app-shell {
        width: min(100% - 20px, 1240px);
        margin: 10px auto;
      }

      .topbar {
        top: 10px;
        flex-wrap: wrap;
        border-radius: 24px;
      }

      .top-actions {
        width: 100%;
        justify-content: space-between;
      }

      .coin-chip,
      .back-link {
        flex: 1 1 auto;
      }

      .brand-logo {
        width: 142px;
      }

      .hero-panel {
        border-radius: 24px;
        padding: 22px;
      }

      .title {
        font-size: clamp(38px, 13vw, 56px);
      }

      .sub {
        font-size: 16px;
      }

      .shop-list {
        grid-template-columns: 1fr;
        grid-row: 2;
      }

      .item-bottom {
        align-items: stretch;
        flex-direction: column;
      }

      .buy-btn {
        width: 100%;
      }

      .cart-head {
        align-items: flex-start;
      }

      .cart-title-wrap {
        min-width: 0;
      }

      .cart-title-wrap .panel-copy {
        display: none;
      }

      .cart-close {
        display: grid;
        place-items: center;
        margin-left: auto;
      }

      .cart-row {
        align-items: stretch;
        flex-direction: column;
      }

      .quantity-control {
        justify-content: space-between;
      }

      .cart-actions,
      .cart-secondary,
      .cart-checkout {
        width: 100%;
      }

      .cart-panel {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        z-index: 90;
        display: none;
        max-height: min(78vh, 620px);
        overflow-y: auto;
        border-radius: 26px;
        padding: 18px;
        transform: translateY(18px);
      }

      .cart-panel.mobile-open {
        display: block;
        animation: cartSheetIn 200ms ease forwards;
      }

      .cart-backdrop.show,
      .mobile-cart-fab {
        display: flex;
      }

      .mobile-cart-fab {
        bottom: calc(18px + env(safe-area-inset-bottom));
      }
    }

    @keyframes cartSheetIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

</head>
<body>
  <header class="app-shell topbar fade-up">
    <a class="brand-link" href="welcome.html" aria-label="Tutorly welcome page">
      <img class="brand-logo" src="assets/title-logo.png" alt="Tutorly" />
    </a>

    <div class="top-actions">
      <div class="coin-chip" title="Learning coins">
        <span class="coin">$</span>
        <span id="coinBalance">1,250</span>
      </div>
      <a class="back-link" href="home.html">Back to Home</a>
    </div>
  </header>

  <main class="app-shell shop-grid">
    <section class="panel hero-panel fade-up d2">
      <span class="kicker">Student coin shop</span>
      <h1 class="title">Buy helpful boosts for tests.</h1>
      <p class="sub">Spend your Tutor Tokens on smart helps like double chance, erase answers, extra time, and hints. Add boosts to your cart, then checkout when you are ready.</p>
    </section>

    <section id="cartPanel" class="panel cart-panel fade-up d3" aria-label="Cart">
      <div class="cart-head">
        <div class="cart-title-wrap">
          <span class="cart-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <circle cx="9" cy="20" r="1.5"></circle>
              <circle cx="18" cy="20" r="1.5"></circle>
              <path d="M3 4h2l2.4 10.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 1.9-1.4L21 8H6"></path>
            </svg>
          </span>
          <div>
            <h2 class="panel-title">Cart</h2>
            <p class="panel-copy">Your selected helps will appear here before you spend coins.</p>
          </div>
        </div>
        <button id="cartCloseBtn" class="cart-close" type="button" aria-label="Close cart">Ã—</button>
        <span id="cartTotalPill" class="cart-pill"><span class="coin">$</span>0</span>
      </div>

      <div id="cartList" class="cart-list"></div>

      <div class="cart-actions">
        <button id="clearCartBtn" class="cart-secondary" type="button">Clear Cart</button>
        <button id="checkoutBtn" class="cart-checkout" type="button">Checkout</button>
      </div>
    </section>

    <div id="shopList" class="shop-list fade-up d3" aria-label="Shop items"></div>
  </main>

  <div id="cartBackdrop" class="cart-backdrop" aria-hidden="true"></div>
  <button id="mobileCartFab" class="mobile-cart-fab" type="button" aria-label="Open cart" aria-expanded="false" aria-controls="cartPanel">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="9" cy="20" r="1.5"></circle>
      <circle cx="18" cy="20" r="1.5"></circle>
      <path d="M3 4h2l2.4 10.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 1.9-1.4L21 8H6"></path>
    </svg>
    <span id="mobileCartCount" class="mobile-cart-count">0</span>
  </button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const startingCoins = 1250;
    const coinBalance = document.getElementById("coinBalance");
    const shopList = document.getElementById("shopList");
    const cartPanel = document.getElementById("cartPanel");
    const cartBackdrop = document.getElementById("cartBackdrop");
    const mobileCartFab = document.getElementById("mobileCartFab");
    const mobileCartCount = document.getElementById("mobileCartCount");
    const cartCloseBtn = document.getElementById("cartCloseBtn");
    const cartList = document.getElementById("cartList");
    const cartTotalPill = document.getElementById("cartTotalPill");
    const clearCartBtn = document.getElementById("clearCartBtn");
    const checkoutBtn = document.getElementById("checkoutBtn");
    const toast = document.getElementById("toast");

    const shopItems = [
      {
        id: "double-chance",
        name: "Double Chance",
        tag: "Quiz help",
        icon: "2x",
        price: 180,
        description: "Pick one extra answer if your first choice feels risky."
      },
      {
        id: "erase-two",
        name: "Erase 2 Answers",
        tag: "MCQ help",
        icon: "-2",
        price: 220,
        description: "Remove two wrong options from a multiple-choice question."
      },
      {
        id: "time-freeze",
        name: "Time Freeze",
        tag: "Speed help",
        icon: "+30",
        price: 160,
        description: "Pause pressure and add 30 seconds to one timed question."
      },
      {
        id: "hint-spark",
        name: "Hint Spark",
        tag: "Tutor help",
        icon: "?",
        price: 120,
        description: "Reveal a small clue without giving away the full answer."
      },
      {
        id: "skip-pass",
        name: "Skip Pass",
        tag: "Safe move",
        icon: ">>",
        price: 260,
        description: "Skip one tough question and move forward without panic."
      },
      {
        id: "streak-shield",
        name: "Streak Shield",
        tag: "Progress help",
        icon: "S",
        price: 300,
        description: "Protect your study streak once if you miss a daily task."
      }
    ];

    let coins = Number(localStorage.getItem("tutorly_coins"));
    if (!Number.isFinite(coins)) coins = startingCoins;

    let inventory = {};
    try {
      inventory = JSON.parse(localStorage.getItem("tutorly_shop_inventory")) || {};
    } catch (error) {
      inventory = {};
    }

    let cart = {};
    try {
      cart = JSON.parse(localStorage.getItem("tutorly_shop_cart")) || {};
    } catch (error) {
      cart = {};
    }

    function formatCoins(value) {
      return new Intl.NumberFormat("en-US").format(value);
    }

    function saveShopState() {
      localStorage.setItem("tutorly_coins", String(coins));
      localStorage.setItem("tutorly_shop_inventory", JSON.stringify(inventory));
      localStorage.setItem("tutorly_shop_cart", JSON.stringify(cart));
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    function getCartTotal() {
      return shopItems.reduce((total, item) => {
        return total + (cart[item.id] || 0) * item.price;
      }, 0);
    }

    function getCartCount() {
      return Object.values(cart).reduce((total, count) => total + count, 0);
    }

    function isMobileShopLayout() {
      return window.matchMedia("(max-width: 720px)").matches;
    }

    function toggleMobileCart(forceOpen) {
      if (!cartPanel || !cartBackdrop || !mobileCartFab) return;
      const shouldOpen = typeof forceOpen === "boolean" ? forceOpen : !cartPanel.classList.contains("mobile-open");
      cartPanel.classList.toggle("mobile-open", shouldOpen);
      cartBackdrop.classList.toggle("show", shouldOpen);
      document.body.classList.toggle("cart-popup-open", shouldOpen);
      mobileCartFab.setAttribute("aria-expanded", shouldOpen ? "true" : "false");
    }

    function closeMobileCart() {
      toggleMobileCart(false);
    }

    function renderCart() {
      const total = getCartTotal();
      const count = getCartCount();
      cartTotalPill.innerHTML = `<span class="coin">$</span>${formatCoins(total)}`;
      mobileCartCount.textContent = count;

      if (!count) {
        cartList.innerHTML = `<p class="cart-empty">Your cart is empty. Add a boost from below.</p>`;
      } else {
        cartList.innerHTML = shopItems
          .filter((item) => cart[item.id])
          .map((item) => `
            <div class="cart-row">
              <span class="cart-item-main">
                <span>${item.name}</span>
                <small><span class="coin">$</span>${formatCoins(item.price)} each</small>
              </span>
              <span class="quantity-control" aria-label="${item.name} quantity">
                <button class="qty-btn" type="button" data-cart-minus="${item.id}" aria-label="Remove one ${item.name}">-</button>
                <b>x${cart[item.id]}</b>
                <button class="qty-btn" type="button" data-cart-plus="${item.id}" aria-label="Add one ${item.name}">+</button>
              </span>
            </div>
          `)
          .join("");
      }

      clearCartBtn.disabled = count === 0;
      checkoutBtn.disabled = count === 0 || total > coins;
      checkoutBtn.textContent = total > coins && count > 0 ? "Need more coins" : "Checkout";
    }

    function renderShop() {
      coinBalance.textContent = formatCoins(coins);
      shopList.innerHTML = shopItems.map((item) => {
        const canAdd = coins >= item.price;
        return `
          <article class="shop-card">
            <div class="item-top">
              <span class="item-icon">${item.icon}</span>
              <span class="tag">${item.tag}</span>
            </div>
            <h2>${item.name}</h2>
            <p>${item.description}</p>
            <div class="item-bottom">
              <span class="price"><span class="coin">$</span>${formatCoins(item.price)}</span>
              <button class="buy-btn" type="button" data-add="${item.id}" ${canAdd ? "" : "disabled"}>${canAdd ? "Add to Cart" : "Need more"}</button>
            </div>
          </article>
        `;
      }).join("");
      renderCart();
    }

    shopList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-add]");
      if (!button) return;

      const item = shopItems.find((entry) => entry.id === button.dataset.add);
      if (!item) return;

      if (coins < item.price) {
        showToast(`You need ${formatCoins(item.price - coins)} more coins for ${item.name}.`);
        return;
      }

      cart[item.id] = (cart[item.id] || 0) + 1;
      saveShopState();
      renderShop();
      showToast(`${item.name} added to cart.`);
    });

    cartList.addEventListener("click", (event) => {
      const plusButton = event.target.closest("[data-cart-plus]");
      const minusButton = event.target.closest("[data-cart-minus]");
      const itemId = plusButton ? plusButton.dataset.cartPlus : minusButton ? minusButton.dataset.cartMinus : "";
      if (!itemId) return;

      const item = shopItems.find((entry) => entry.id === itemId);
      if (!item) return;

      if (plusButton) {
        cart[item.id] = (cart[item.id] || 0) + 1;
        showToast(`${item.name} quantity increased.`);
      }

      if (minusButton) {
        cart[item.id] = Math.max((cart[item.id] || 0) - 1, 0);
        if (!cart[item.id]) delete cart[item.id];
        showToast(`${item.name} quantity decreased.`);
      }

      saveShopState();
      renderShop();
    });

    clearCartBtn.addEventListener("click", () => {
      cart = {};
      saveShopState();
      renderShop();
      showToast("Cart cleared.");
    });

    checkoutBtn.addEventListener("click", () => {
      const total = getCartTotal();
      const count = getCartCount();
      if (!count) return;

      if (total > coins) {
        showToast(`You need ${formatCoins(total - coins)} more coins to checkout.`);
        return;
      }

      coins -= total;
      Object.entries(cart).forEach(([id, count]) => {
        inventory[id] = (inventory[id] || 0) + count;
      });
      cart = {};
      saveShopState();
      renderShop();
      showToast("Checkout complete. Helps added.");
      closeMobileCart();
    });

    mobileCartFab.addEventListener("click", () => {
      toggleMobileCart(true);
    });

    cartCloseBtn.addEventListener("click", closeMobileCart);
    cartBackdrop.addEventListener("click", closeMobileCart);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeMobileCart();
    });

    window.addEventListener("resize", () => {
      if (!isMobileShopLayout()) closeMobileCart();
    });

    renderShop();
  </script>
  <script src="js/global-layout.js?v=nav-redesign-20260531"></script>
  <script src="js/swipe-home.js?v=nav-redesign-20260531d"></script>
  <script src="js/mobile-app.js?v=mobile-first-20260623"></script>
</body>
</html>
