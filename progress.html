<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tutorly</title>
  <link rel="icon" type="image/png" href="assets/brand-star.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tutorly-foundation.css" />
</head>
<body data-foundation-page="progress">
  <header class="foundation-header"><div class="foundation-header-inner">
    <a class="foundation-brand" href="maths_gpt.html"><span class="foundation-brand-mark">&#10022;</span>Tutorly</a>
    <div class="foundation-actions"><button id="foundationTheme" class="foundation-icon" type="button" aria-label="Switch color theme">☾</button><a class="foundation-button-secondary" href="maths_gpt.html">Back to chat</a></div>
  </div></header>
  <main class="foundation-main">
    <section class="foundation-hero"><p class="foundation-eyebrow">Progress</p><h1>See the work that is moving you forward.</h1><p>This foundation reads your locally saved Tutorly activity and will expand into subject trends, goals, and skill-level insights.</p></section>
    <section class="foundation-grid">
      <article class="foundation-card"><span class="metric-label">Tests completed</span><strong id="progressTests" class="metric-value">0</strong></article>
      <article class="foundation-card"><span class="metric-label">Average score</span><strong id="progressScore" class="metric-value">0%</strong></article>
      <article class="foundation-card"><span class="metric-label">Saved chats</span><strong id="progressChats" class="metric-value">0</strong></article>
      <article class="foundation-card"><span class="metric-label">Study streak</span><strong id="progressStreak" class="metric-value">0</strong></article>
    </section>
  </main>
  <script src="js/tutorly-foundation.js"></script>
</body>
</html>
